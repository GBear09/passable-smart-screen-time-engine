start_timer:
  name: Start Screen Time Timer
  description: Starts an unlock ("One More Show"), temporary lockout, or wind-down countdown timer for a device or all devices.
  fields:
    device_id:
      name: Device ID
      description: The ID of the managed device (e.g., living_room_tv_2), or 'all' for all devices.
      required: true
      selector:
        text: {}
    mode:
      name: Timer Mode
      description: Whether to unlock temporarily (unlock), lock temporarily (lock), or lock after countdown (wind_down).
      default: unlock
      selector:
        select:
          options:
            - unlock
            - lock
            - wind_down
    duration:
      name: Duration
      description: Number of minutes or hours (ignored if until_time is provided).
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    unit:
      name: Unit
      description: Duration unit (minutes or hours).
      default: minutes
      selector:
        select:
          options:
            - minutes
            - hours
    until_time:
      name: Until Time
      description: Optional local 24h target time (HH:MM) instead of duration.
      required: false
      selector:
        text: {}
    power_on:
      name: Power On Device
      description: When mode is 'unlock', whether to power on media_player devices immediately.
      default: false
      selector:
        boolean: {}

cancel_timer:
  name: Cancel Viewing Timer
  description: Cancels an active countdown timer for a device (or 'all').
  fields:
    device_id:
      name: Device ID
      description: The ID of the managed device, or 'all'.
      required: true
      selector:
        text: {}

set_lockout:
  name: Set Device Lockout
  description: Explicitly lock or unlock a device and update hardware power or network pause.
  fields:
    device_id:
      name: Device ID
      description: The ID of the managed device, or 'all' to set all devices.
      required: false
      default: all
      selector:
        text: {}
    locked:
      name: Locked
      description: True to lock (restrict), False to unlock.
      required: true
      selector:
        boolean: {}
    power_on:
      name: Power On Device
      description: If unlocking, whether to also turn ON the media player or unpause network switch.
      default: false
      selector:
        boolean: {}
    rest_of_day:
      name: Lock for Rest of Day
      description: If locking, keep locked until midnight rollover (bypassing schedule auto-unlock today).
      default: false
      selector:
        boolean: {}

adjust_bonus_time:
  name: Adjust Bonus Screen Time
  description: Adds or resets bonus screen time minutes for today (auto-unlocks if locked solely by daily limit).
  fields:
    device_id:
      name: Device ID
      description: The ID of the managed device, or 'all'.
      required: false
      default: all
      selector:
        text: {}
    delta_minutes:
      name: Delta Minutes
      description: Bonus minutes to add today.
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    reset:
      name: Reset Bonus Time
      description: Reset today's bonus minutes back to 0.
      default: false
      selector:
        boolean: {}

toggle_all_lockouts:
  name: Toggle All Lockouts
  description: Master toggle for all managed screen time devices. If any device is locked, unlocks all; if all are unlocked, locks all.

import_legacy_helpers:
  name: Import Legacy Helpers
  description: Scans Home Assistant for legacy device lockout input_text and input_boolean helpers and migrates them into native .storage.

delete_device:
  name: Delete Managed Device
  description: Permanently removes a device from the Screen Time Engine and cleans up its associated entities.
  fields:
    device_id:
      name: Device ID
      description: The ID of the device to delete (e.g., living_room_tv_2).
      required: true
      selector:
        text: {}

reconcile_screen_time:
  name: Reconcile Screen Time
  description: Pulls state history directly from Home Assistant Recorder to accurately backfill and reconcile cumulative screen time and applications used today.
  fields:
    device_id:
      name: Device ID
      description: The ID of the managed device (or 'all' for all devices).
      required: false
      default: all
      selector:
        text: {}
